
  <!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>Erişim Engellendi | Sistem Kapatıldı</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="min-h-screen bg-[#020710] text-slate-200 flex items-center justify-center p-4 select-none overflow-hidden font-mono">
  <div class="max-w-md w-full bg-[#06101e] border-2 border-rose-500/50 rounded-2xl p-6 text-center shadow-2xl space-y-4">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-500/10 border border-rose-500/40 flex items-center justify-center">
      <i class="fa-solid fa-ban text-rose-500 text-3xl"></i>
    </div>
    <div class="inline-block px-3 py-1 rounded bg-rose-500/20 text-rose-300 border border-rose-500/40 text-xs font-bold uppercase">
      HTTP 403 • ERİŞİM ENGELLENDİ
    </div>
    <h1 class="text-lg font-bold text-white">Bu Site Yöneticisi Tarafından Kapatılmıştır</h1>
    <p class="text-xs text-slate-400 leading-relaxed">
      Proje simülasyonu, uydu telemetri verileri ve döküman paylaşımları dış erişime tamamen kapatılmıştır.
    </p>
  </div>
  <script>
    // Sağ tık ve geliştirici konsolu kısayollarını engelle
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toUpperCase() === 'U')) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
